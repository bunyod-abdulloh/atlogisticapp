{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    .dash-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        margin-top: 6px;
    }

    .dash-card { text-decoration: none; }

    .dash-stat {
        position: relative;
        overflow: hidden;
        border-radius: 18px;
        padding: 32px 30px 28px;
        min-height: 150px;
        color: #fff !important;
        box-shadow: 0 3px 10px rgba(0, 0, 0, .14);
        transition: transform .16s ease, box-shadow .16s ease;
    }

    .dash-card:hover .dash-stat {
        transform: translateY(-5px);
        box-shadow: 0 16px 30px rgba(0, 0, 0, .24);
    }

    .dash-stat .dash-num {
        font-size: 52px;
        font-weight: 700;
        line-height: 1;
        color: #fff !important;
    }

    .dash-stat .dash-label {
        margin-top: 10px;
        font-size: 17px;
        font-weight: 500;
        color: #fff !important;
        opacity: .95;
    }

    .dash-stat .dash-icon {
        position: absolute;
        right: 18px;
        bottom: 10px;
        font-size: 78px;
        color: #fff;
        opacity: .16;
    }

    /* Kechikkan bosqichlar kartasi butun qatorni egallaydi */
    .dash-card.dash-card-wide { grid-column: 1 / -1; }
    .dash-card-wide .dash-stat { min-height: 110px; padding: 26px 34px; }
    .dash-card-wide .dash-num { font-size: 40px; }
</style>
{% endblock %}

{% block content %}
<div class="dash-grid">
    <a href="{{ total_url }}" class="dash-card">
        <div class="dash-stat" style="background-color:#343a40">
            <div class="dash-num">{{ total_shipments }}</div>
            <div class="dash-label">Jami jo'natmalar</div>
            <i class="fas fa-boxes dash-icon"></i>
        </div>
    </a>

    {% for item in status_counts %}
    <a href="{{ item.url }}" class="dash-card">
        <div class="dash-stat" style="background-color:{{ item.color }}">
            <div class="dash-num">{{ item.count }}</div>
            <div class="dash-label">{{ item.label }}</div>
            <i class="fas fa-shipping-fast dash-icon"></i>
        </div>
    </a>
    {% endfor %}

    <a href="{{ overdue_total_url }}" class="dash-card dash-card-wide">
        <div class="dash-stat" style="background-color:#dc3545">
            <div class="dash-num">{{ overdue_total }}</div>
            <div class="dash-label">Kechikkan bosqichlar (jami)</div>
            <i class="fas fa-exclamation-triangle dash-icon"></i>
        </div>
    </a>
</div>
{% endblock %}
